<!DOCTYPE html>
<html>

<head>
    <title>Language Translator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <!-- Dark Mode Toggle Button -->
    <button id="darkModeToggle" style="position: absolute; top: 20px; right: 20px; padding: 8px 12px; cursor: pointer; border-radius: 5px; border: none; background: #333; color: white;">🌙 Dark Mode</button>

    <div class="container">

        <h1>Language Translator</h1>

        <textarea id="inputText" placeholder="Enter text here"></textarea>
        
        <br><br>

        <label>Source Language:</label>

        <select id="sourceLanguage">
            <option value="en">English</option>
            <option value="hi">Hindi</option>
            <option value="fr">French</option>
            <option value="es">Spanish</option>
            <option value="de">German</option>
            <option value="ja">Japanese</option>
            <option value="gu">Gujarati</option>
            <option value="bn">Bengali</option>
            <option value="mr">Marathi</option>
            <option value="ta">Tamil</option>
            <option value="te">Telugu</option>
            <option value="ar">Arabic</option>
            <option value="ko">Korean</option>
            <option value="ru">Russian</option>
            <option value="it">Italian</option>
        </select>

        <br><br>

        <!-- Swap Button -->
        <button id="swapButton" style="background: #6c757d; color: white; padding: 5px 10px; border: none; border-radius: 4px; cursor: pointer;">⇄ Swap Languages</button>

        <br><br>

        <label>Target Language:</label>

        <select id="targetLanguage">
            <option value="hi">Hindi</option>
            <option value="en">English</option>
            <option value="fr">French</option>
            <option value="es">Spanish</option>
            <option value="de">German</option>
            <option value="ja">Japanese</option>
            <option value="gu">Gujarati</option>
            <option value="bn">Bengali</option>
            <option value="mr">Marathi</option>
            <option value="ta">Tamil</option>
            <option value="te">Telugu</option>
            <option value="ar">Arabic</option>
            <option value="ko">Korean</option>
            <option value="ru">Russian</option>
            <option value="it">Italian</option>
        </select>

        <br><br>

        <button id="translateButton">Translate</button>

        <!-- Loading Text Indicator -->
        <p id="loadingText" style="display: none; color: #007bff; font-weight: bold;">⏳ Translating & Generating Audio...</p>

        <h2>Translation:</h2>

        <textarea id="translationText" placeholder="Translation will appear here" readonly></textarea>
        <button id="copyButton">Copy</button>
        <button id="speakButton">🔊 Speak</button>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
